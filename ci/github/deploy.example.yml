# Build → scan → sign → deploy, for a service repository that ships with the
# platform's Helm chart. Copy into .github/workflows/ and set:
#   secrets.KUBE_CONFIG   kubeconfig of a namespace-scoped deployer (k8s/ci-deployer.yaml, not cluster-admin)
#   vars.RELEASE / vars.NAMESPACE / vars.VALUES_FILE
name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false      # never cancel a rollout half way

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

  security:
    needs: build
    permissions: {contents: read, packages: read, security-events: write}
    uses: <owner>/k3s-platform-kit/.github/workflows/security.yml@main
    with: {image: "ghcr.io/${{ github.repository }}:${{ github.sha }}"}

  sign:
    needs: [build, security]
    runs-on: ubuntu-latest
    permissions: {packages: write, id-token: write}   # keyless: identity from the OIDC token
    steps:
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      # Sign the digest, not the tag: a tag can be moved, a digest cannot.
      - run: cosign sign --yes "${IMAGE}@${{ needs.build.outputs.digest }}"

  deploy:
    needs: [build, sign]
    runs-on: ubuntu-latest
    environment: production        # protection rules / required reviewers live here
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm upgrade
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/kubeconfig"
          printf '%s' "$KUBECONFIG_DATA" > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          # --atomic rolls back by itself if the pods never become ready.
          helm upgrade --install "${{ vars.RELEASE }}" oci://ghcr.io/${{ github.repository_owner }}/charts/app \
            --namespace "${{ vars.NAMESPACE }}" \
            --values "${{ vars.VALUES_FILE }}" \
            --set image.repository="$IMAGE" \
            --set image.tag="${{ github.sha }}" \
            --atomic --wait --timeout 10m
