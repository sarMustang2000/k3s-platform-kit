---
# Baseline for every server: packages, time, automatic security updates, firewall, sysctl, SSH hardening.
- name: Install base packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - jq
      - ufw
      - fail2ban
      - chrony
      - unattended-upgrades
      - python3-pip
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set timezone
  community.general.timezone:
    name: "{{ platform_timezone }}"

- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Kernel settings for containers (inotify watches, file handles, connection backlog)
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-platform.conf
    reload: true
  loop: "{{ common_sysctl | dict2items }}"

# sshd keeps the FIRST value it reads for each keyword and reads sshd_config.d/
# in name order, so this file must sort before cloud-init's 50-cloud-init.conf
# (which sets PasswordAuthentication yes). As 90-platform.conf it was ignored.
- name: Harden SSH (key-only login)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/01-platform.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      X11Forwarding no
      MaxAuthTries 3
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh
  when: common_harden_ssh | bool

- name: Remove the SSH drop-in that sorted too late to take effect
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/90-platform.conf
    state: absent
  notify: Restart ssh
  when: common_harden_ssh | bool

- name: Firewall - allow SSH (on the port Ansible connects with) from admin networks
  community.general.ufw:
    rule: allow
    port: "{{ common_ssh_port | string }}"
    proto: tcp
    from_ip: "{{ item }}"
  loop: "{{ admin_cidrs }}"

- name: Firewall - default deny incoming, allow outgoing
  community.general.ufw:
    state: enabled
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - {direction: incoming, policy: deny}
    - {direction: outgoing, policy: allow}

- name: Point fail2ban at the real SSH port
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/platform-sshd.local
    content: |
      [sshd]
      enabled = true
      port = {{ common_ssh_port }}
    mode: "0644"
  notify: Restart fail2ban

- name: Enable fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
