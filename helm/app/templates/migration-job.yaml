{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "app.name" . }}-migrate
  labels: {{- include "app.labels" . | nindent 4 }}
  annotations:
    # Runs before the new pods; after the ConfigMap hook (weight -5) it reads.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels: {{- include "app.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "app.podSpecCommon" . | nindent 6 }}
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "app.image" . }}
          command: {{- toYaml .Values.migration.command | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          {{- include "app.envFrom" . | nindent 10 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- include "app.volumeMounts" . | nindent 10 }}
      {{- include "app.volumes" . | nindent 6 }}
{{- end }}
