# Reusable security gate. Call it from a service repository:
#
#   jobs:
#     security:
#       uses: <owner>/k3s-platform-kit/.github/workflows/security.yml@main
#       with: {image: ghcr.io/acme/api:${{ github.sha }}}
#
# Every scanner fails the build on HIGH/CRITICAL findings it can act on, and
# uploads SARIF so findings show in the repository's Security tab.
name: security

on:
  workflow_call:
    inputs:
      image:
        description: Image to scan (omit to skip the image stage)
        type: string
        default: ""
      severity:
        type: string
        default: HIGH,CRITICAL

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # full history: a secret deleted later is still leaked
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --redact --verbose --report-format sarif --report-path /repo/gitleaks.sarif
      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with: {sarif_file: gitleaks.sarif, category: gitleaks}

  sast:
    name: code (semgrep)
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.97.0
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/default --sarif --output semgrep.sarif --error --severity ERROR
      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with: {sarif_file: semgrep.sarif, category: semgrep}

  dependencies-and-iac:
    name: dependencies + IaC (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: vulnerable dependencies
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln
          severity: ${{ inputs.severity }}
          ignore-unfixed: true    # only fail on what an upgrade can fix
          exit-code: "1"
      - name: misconfigured Dockerfiles, Helm charts, manifests
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          severity: ${{ inputs.severity }}
          exit-code: "1"

  image:
    name: image (trivy + SBOM)
    if: inputs.image != ''
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: read, security-events: write}
    steps:
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ inputs.image }}
          severity: ${{ inputs.severity }}
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          exit-code: "1"
      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with: {sarif_file: trivy-image.sarif, category: trivy-image}
      - name: SBOM (CycloneDX)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with: {image-ref: "${{ inputs.image }}", format: cyclonedx, output: sbom.cdx.json}
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: sbom, path: sbom.cdx.json}
