# Local OpenTelemetry stack: point an app at OTLP (localhost:4317 / 4318) and
# see its traces, metrics and logs in Grafana on http://localhost:3000.
# `docker compose --profile demo up` also starts a generator, so there is data
# to look at before any app is wired in.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on: [jaeger, loki]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment: [COLLECTOR_OTLP_ENABLED=true]
    ports: ["16686:16686"]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  loki:
    image: grafana/loki:3.3.0
    command: ["-config.file=/etc/loki/local-config.yaml"]

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes: ["./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro"]
    ports: ["3000:3000"]
    depends_on: [prometheus, jaeger, loki]

  telemetrygen:
    profiles: [demo]
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.114.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        while true; do
          /telemetrygen traces  --otlp-endpoint=otel-collector:4317 --otlp-insecure --duration=30s --rate=5 --service=checkout &
          /telemetrygen metrics --otlp-endpoint=otel-collector:4317 --otlp-insecure --duration=30s --rate=2 --service=checkout &
          /telemetrygen logs    --otlp-endpoint=otel-collector:4317 --otlp-insecure --duration=30s --rate=2 --service=checkout;
          wait;
        done
    depends_on: [otel-collector]
